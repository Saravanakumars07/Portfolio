<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="gradDL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#000000"/>
  
  <!-- Neural Layers - Perspective View -->
  <g transform="translate(100, 100) skewX(-10)">
    <!-- Layer 1 -->
    <rect x="0" y="0" width="100" height="400" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
    <!-- Layer 2 -->
    <rect x="150" y="50" width="100" height="300" fill="#312e81" stroke="#8b5cf6" stroke-width="2" opacity="0.8"/>
    <!-- Layer 3 -->
    <rect x="300" y="100" width="100" height="200" fill="#4338ca" stroke="#a78bfa" stroke-width="2" opacity="0.8"/>
    <!-- Layer 4 -->
    <rect x="450" y="150" width="100" height="100" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="#e879f9" stroke-width="1" opacity="0.4">
    <line x1="150" y1="150" x2="250" y2="200"/>
    <line x1="150" y1="450" x2="250" y2="400"/>
    <line x1="300" y1="200" x2="400" y2="250"/>
    <line x1="300" y1="400" x2="400" y2="350"/>
  </g>

  <text x="650" y="500" font-family="sans-serif" font-size="24" fill="#e879f9" text-anchor="end" font-weight="bold">DEEP LEARNING</text>
  <text x="650" y="530" font-family="sans-serif" font-size="16" fill="#a855f7" text-anchor="end">NEURAL ARCHITECTURE</text>
</svg>