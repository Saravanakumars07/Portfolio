<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#020617"/>
  
  <!-- Background Hexagons -->
  <path d="M100 100 L150 100 L175 143 L150 186 L100 186 L75 143 Z" stroke="#1e293b" fill="none" stroke-width="2"/>
  <path d="M600 400 L650 400 L675 443 L650 486 L600 486 L575 443 Z" stroke="#1e293b" fill="none" stroke-width="2"/>
  
  <!-- Central Globe/Sphere Wireframe -->
  <g transform="translate(400, 300)">
    <circle r="120" stroke="#0ea5e9" stroke-width="1" fill="#0f172a" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="120" ry="40" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="40" ry="120" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.7" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="40" ry="120" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.7" transform="rotate(-45)"/>
  </g>

  <!-- Floating Data Points -->
  <circle cx="350" cy="250" r="4" fill="#38bdf8"/>
  <circle cx="450" cy="350" r="4" fill="#38bdf8"/>
  <circle cx="420" cy="220" r="4" fill="#38bdf8"/>
  <circle cx="380" cy="380" r="4" fill="#38bdf8"/>

  <!-- Analytics Bar stylized -->
  <rect x="50" y="500" width="20" height="50" fill="#0284c7"/>
  <rect x="80" y="480" width="20" height="70" fill="#0284c7"/>
  <rect x="110" y="450" width="20" height="100" fill="#0ea5e9"/>
  <rect x="140" y="420" width="20" height="130" fill="#38bdf8"/>

  <text x="750" y="550" font-family="sans-serif" font-size="24" fill="#38bdf8" text-anchor="end" font-weight="bold">DATA SCIENCE</text>
  <text x="750" y="575" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="end">INSIGHTS & ANALYTICS</text>
</svg>